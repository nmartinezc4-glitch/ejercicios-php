<!DOCTYPE html>
<!-- <html>: Elemento raíz que envuelve todo el documento HTML -->
<html lang="es">
    <head>
        <!-- <meta charset="utf-8">: Permite el soporte para tildes, caracteres japoneses y símbolos especiales -->
        <meta charset="utf-8">
        <!-- <title>: Define el título visible en la pestaña del navegador -->
        <title>Página Hola Mundo - Día 2</title>
    </head>
    <body>
        <!-- <a>: Enlace hipertexto (en este caso con estilo en línea para regresar al menú) -->
        <p><a href="../paginapersonal/index.html" style="display:inline-block;padding:10px 18px;background:#0b1f3a;color:#ffffff;text-decoration:none;border-radius:6px;font-family:Arial,sans-serif;font-weight:bold;">&larr; Volver a la página principal</a></p>
        
        <!-- <p>: Párrafo simple de texto -->
        <p>Nestor Joseph Martinez Cruz</p>
        
        <!-- <hr>: Línea horizontal divisoria temática (Horizontal Rule) -->
        <hr>
        
        <!-- Caracteres especiales como el símbolo de copyright © y de euro € -->
        <p>Derechos reservados © 2017 Valor € 400 </p>
        
        <!-- Ejemplo de texto en otros alfabetos (japonés) soportado gracias a UTF-8 -->
        <p>Japanese example: ご飯が熱い 。 </p>
        
        <!-- &lt; y &gt;: Entidades HTML para mostrar los signos menor que (<) y mayor que (>) como texto sin que el navegador los interprete como etiquetas -->
        <p>En HTML, un párrafo se define con el elemento &lt;p&gt;.</p>
        <p>&lt;img src=&quot;images/test.png&quot;&gt;</p>
        
        <!-- <mark>: Resalta el texto con un fondo de color amarillo por defecto (marcador/resaltador) -->
        <mark> Prueba de elemento de formato MARKED </mark>
        
        <hr>
        
        <!-- <h1>: Encabezado principal de nivel 1 -->
        <h1> Esta es mi página web </h1>
        
        <!-- Ejemplo de atributos y etiquetas de formato clásico/obsoleto de HTML antiguo: -->
        <!-- bgcolor: Atributo antiguo para color de fondo (actualmente se usa CSS background-color) -->
        <!-- align="right": Atributo antiguo para alinear a la derecha (actualmente se usa CSS text-align: right) -->
        <!-- <font>: Etiqueta antigua para cambiar tipografía, tamaño y color (actualmente reemplazada por CSS) -->
        <div style="background-color: lightblue; padding: 10px;">
            <p align="right">
                <font face="Console" size="5" color="purple">
                    <!-- <strong>: Texto en negrita con importancia semántica -->
                    <strong> Demo </strong> 
                    <!-- <em>: Texto en cursiva/énfasis semántico -->
                    <em> Text </em>
                </font>
                <!-- <center>: Etiqueta clásica para centrar texto (actualmente se usa CSS text-align: center) -->
                <center> Sample Text </center> 
            </p>
        </div>
    </body>
</html>
